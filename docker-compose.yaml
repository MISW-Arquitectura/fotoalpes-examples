# Nota: no se define 'restart' a proposito. Si un servicio falla queremos que
# quede caido y visible en 'docker compose ps', no que se reinicie en bucle
# ocultando el error.

x-healthcheck-puerto: &healthcheck-puerto
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  redis:
    image: redis:8.2-alpine
    # Volumen nombrado en vez de bind mount a ./data: la cola es efimera y
    # persistirla en el repo provocaba que un dump.rdb viejo impidiera
    # arrancar al cambiar de version de redis. Se limpia con 'down -v'.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jwt:
    build: ./jwt
    volumes:
      - ./jwt/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  acl:
    build: ./acl
    volumes:
      - ./acl/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  users:
    build: ./usuarios
    volumes:
      - ./usuarios/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  products:
    build: ./productos
    volumes:
      - ./productos/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  # El servicio de ordenes consulta al componente jwt y al ACL al arrancar,
  # por eso depende de que ambos esten saludables.
  orders:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      jwt:
        condition: service_healthy
      acl:
        condition: service_healthy
      redis:
        condition: service_healthy

  # La base de datos 1 de redis corresponde al id que devuelve el ACL para el
  # servicio de ordenes (ver acl/build_database.py).
  worker:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: rq worker -u 'redis://redis/1'
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      jwt:
        condition: service_healthy
      acl:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - 5000:443
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/localhost.crt:/etc/ssl/certs/localhost.crt:ro
      - ./nginx/localhost.key:/etc/ssl/private/localhost.key:ro
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      orders:
        condition: service_healthy
      jwt:
        condition: service_healthy
      acl:
        condition: service_healthy

volumes:
  redis-data:
