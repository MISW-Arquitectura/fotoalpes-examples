# Nota: no se define 'restart' a proposito. Si un servicio falla queremos que
# quede caido y visible en 'docker compose ps', no que se reinicie en bucle
# ocultando el error.

x-healthcheck-puerto: &healthcheck-puerto
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  redis:
    image: redis:8.2-alpine
    # Volumen nombrado en vez de bind mount a ./data: la cola es efimera y
    # persistirla en el repo provocaba que un dump.rdb viejo impidiera
    # arrancar al cambiar de version de redis. Se limpia con 'down -v'.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  users-commands:
    build: ./usuarios
    volumes:
      - ./usuarios/:/mnt/
    working_dir: /backend/
    command: sh run_commands.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  users-queries:
    build: ./usuarios
    volumes:
      - ./usuarios/:/mnt/
    working_dir: /backend/
    command: sh run_queries.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  products-commands:
    build: ./productos
    volumes:
      - ./productos/:/mnt/
    working_dir: /backend/
    command: sh run_commands.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  products-queries:
    build: ./productos
    volumes:
      - ./productos/:/mnt/
    working_dir: /backend/
    command: sh run_queries.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  orders-commands:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: sh run_commands.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  orders-queries:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: sh run_queries.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      redis:
        condition: service_healthy

  # worker-orders atiende la db 0 de redis: procesa las ordenes y replica en la
  # BD de ordenes los usuarios y productos creados por los otros servicios.
  worker-orders:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: rq worker -u 'redis://redis/0'
    depends_on:
      redis:
        condition: service_healthy

  # worker-products atiende la db 1 de redis: descuenta el stock en la BD de
  # productos cuando el servicio de ordenes lo solicita.
  worker-products:
    build: ./productos
    volumes:
      - ./productos/:/mnt/
    working_dir: /backend/
    command: rq worker -u 'redis://redis/1'
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - 5000:80
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orders-commands:
        condition: service_healthy
      orders-queries:
        condition: service_healthy
      users-commands:
        condition: service_healthy
      users-queries:
        condition: service_healthy
      products-commands:
        condition: service_healthy
      products-queries:
        condition: service_healthy

volumes:
  redis-data:
