# Nota: no se define 'restart' a proposito. Si un servicio falla queremos que
# quede caido y visible en 'docker compose ps', no que se reinicie en bucle
# ocultando el error.

x-healthcheck-puerto: &healthcheck-puerto
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  redis:
    image: redis:8.2-alpine
    # Volumen nombrado en vez de bind mount a ./data: la cola es efimera y
    # persistirla en el repo provocaba que un dump.rdb viejo impidiera
    # arrancar al cambiar de version de redis. Se limpia con 'down -v'.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  users:
    build: ./usuarios
    volumes:
      - ./usuarios/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  products:
    build: ./productos
    volumes:
      - ./productos/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto

  orders:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: sh run.sh
    healthcheck: *healthcheck-puerto
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./ordenes
    volumes:
      - ./ordenes/:/mnt/
    working_dir: /backend/
    command: rq worker -u 'redis://redis/0'
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - 5000:80
    volumes:
      - ./nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      users:
        condition: service_healthy
      products:
        condition: service_healthy
      orders:
        condition: service_healthy

volumes:
  redis-data:
