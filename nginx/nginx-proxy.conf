# DNS interno de Docker. Sin esta directiva nginx resuelve los nombres de los
# servicios UNA SOLA VEZ al arrancar y se queda con esas IPs. Si despues se
# recrea un contenedor (por ejemplo al correr 'docker compose up -d --build'
# tras editar codigo), las IPs pueden intercambiarse y nginx termina enviando
# /users al servicio de productos, que responde 404. Con el resolver y una
# variable en proxy_pass, el nombre se resuelve en cada peticion.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    # 'listen 443 http2 ssl' quedo obsoleto en nginx 1.25; ahora http2 se
    # activa con su propia directiva.
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/ssl/certs/localhost.crt;
    ssl_certificate_key /etc/ssl/private/localhost.key;

    # TLS 1.0 y 1.1 estan obsoletos y las versiones actuales de nginx y
    # OpenSSL ya no los aceptan.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Al usar una variable en proxy_pass, nginx ya no agrega automaticamente la
    # ruta, por eso se pasa $request_uri de forma explicita.
    location /users {
        set $destino_users users;
        proxy_pass https://$destino_users:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /products {
        set $destino_products products;
        proxy_pass https://$destino_products:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /orders {
        set $destino_orders orders;
        proxy_pass https://$destino_orders:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /jwt {
        set $destino_jwt jwt;
        proxy_pass https://$destino_jwt:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /acl {
        set $destino_acl acl;
        proxy_pass https://$destino_acl:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
