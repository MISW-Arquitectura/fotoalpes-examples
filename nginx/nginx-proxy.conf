# DNS interno de Docker. Sin esta directiva nginx resuelve los nombres de los
# servicios UNA SOLA VEZ al arrancar y se queda con esas IPs. Si despues se
# recrea un contenedor (por ejemplo al correr 'docker compose up -d --build'
# tras editar codigo), las IPs pueden intercambiarse y nginx termina enviando
# una ruta al servicio equivocado, que responde 404. Con el resolver y una
# variable en proxy_pass, el nombre se resuelve en cada peticion.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Al usar una variable en proxy_pass, nginx ya no agrega automaticamente la
    # ruta, por eso se pasa $request_uri de forma explicita.
    location /api-commands/users {
        set $destino users-commands;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api-commands/products {
        set $destino products-commands;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api-commands/orders {
        set $destino orders-commands;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api-queries/users {
        set $destino users-queries;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api-queries/products {
        set $destino products-queries;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api-queries/orders {
        set $destino orders-queries;
        proxy_pass http://$destino:5000$request_uri;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
