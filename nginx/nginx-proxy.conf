server {
    # 'listen 443 http2 ssl' quedo obsoleto en nginx 1.25; ahora http2 se
    # activa con su propia directiva.
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/ssl/certs/localhost.crt;
    ssl_certificate_key /etc/ssl/private/localhost.key;

    # TLS 1.0 y 1.1 estan obsoletos y las versiones actuales de nginx y
    # OpenSSL ya no los aceptan.
    ssl_protocols TLSv1.2 TLSv1.3;

    location /users {
        proxy_pass https://users:5000;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /products {
        proxy_pass https://products:5000;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /orders {
        proxy_pass https://orders:5000;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /jwt {
        proxy_pass https://jwt:5000;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /acl {
        proxy_pass https://acl:5000;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
