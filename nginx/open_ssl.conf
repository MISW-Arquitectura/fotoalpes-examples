[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no
[req_distinguished_name]
C = CO
ST = BOG
L = BOG
O = TEST
OU = TEST
CN = localhost
[v3_req]
keyUsage = keyEncipherment, dataEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names
[alt_names]
DNS.1 = localhost
# Nombre del servicio dentro de la red de Docker, util para pruebas que corren
# en un contenedor y no desde el host.
DNS.2 = nginx
IP.1 = 127.0.0.1
