name: CI

on:
  push:
    branches: [async-sec]
  pull_request:
    branches: [async-sec]
  # Corrida mensual: detecta que el ejemplo dejo de funcionar por el paso del
  # tiempo (imagenes base, dependencias, certificados) antes de que empiece el
  # semestre.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Prueba de humo end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Verificar que el certificado no este vencido
        run: openssl x509 -in nginx/localhost.crt -noout -checkend 0 -subject -dates

      - name: Construir y levantar los servicios
        run: docker compose up -d --build --wait

      - name: Estado de los contenedores
        run: docker compose ps

      - name: Ejecutar la prueba de humo
        run: python3 smoke_test.py https://localhost:5000

      # La proyeccion debe poder regenerarse desde el modelo de escritura sin
      # perder informacion. Se reconstruye y se comprueba que las consultas
      # siguen devolviendo lo mismo.
      - name: Reconstruir las proyecciones y verificar que siguen consistentes
        run: |
          cat > /tmp/leer.py <<'PY'
          import json, ssl, sys, urllib.request
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          B = "https://localhost:5000"

          def g(ruta, token=None):
              cab = {"Authorization": "Bearer " + token} if token else {}
              req = urllib.request.Request(B + ruta, headers=cab)
              with urllib.request.urlopen(req, context=ctx) as r:
                  return json.loads(r.read())

          token = g("/api-queries/jwt")["access_token"]
          print(json.dumps({
              "users": g("/api-queries/users", token),
              "products": g("/api-queries/products", token),
              "orders": g("/api-queries/orders", token),
          }, sort_keys=True))
          PY

          python3 /tmp/leer.py > /tmp/antes.json

          docker compose exec -T users-commands python reconstruir_proyeccion.py
          docker compose exec -T products-commands python reconstruir_proyeccion.py
          docker compose exec -T orders-commands python reconstruir_proyeccion.py

          python3 /tmp/leer.py > /tmp/despues.json

          python3 - <<'PY'
          import json, sys
          antes = json.load(open("/tmp/antes.json"))
          despues = json.load(open("/tmp/despues.json"))
          if not despues["orders"]:
              sys.exit("La proyeccion de ordenes quedo vacia tras reconstruirla.")
          if antes != despues:
              print("ANTES:  ", json.dumps(antes, sort_keys=True))
              print("DESPUES:", json.dumps(despues, sort_keys=True))
              sys.exit("La proyeccion reconstruida no coincide con la original.")
          print("Las proyecciones reconstruidas son identicas a las originales.")
          PY

      - name: Logs de los servicios (solo si algo fallo)
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar los servicios
        if: always()
        run: docker compose down -v
